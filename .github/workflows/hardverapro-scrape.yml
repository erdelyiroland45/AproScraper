name: Hardverapro scraper

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hardverapro-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate scraper directory
        id: locate
        shell: bash
        run: |
          if [ -f "github-scraper/package.json" ]; then
            echo "scraper_dir=github-scraper" >> "$GITHUB_OUTPUT"
          else
            echo "scraper_dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.scraper_dir }}
        run: npm install

      - name: Restore previous state
        working-directory: ${{ steps.locate.outputs.scraper_dir }}
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          curl -fsSL "$PAGES_BASE_URL/state.json" -o state.json || true

      - name: Restore previous output
        working-directory: ${{ steps.locate.outputs.scraper_dir }}
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p api
          curl -fsSL "$PAGES_BASE_URL/latest.json" -o api/latest.json || true

      - name: Run scraper
        working-directory: ${{ steps.locate.outputs.scraper_dir }}
        env:
          HARDVERAPRO_URL: ${{ vars.HARDVERAPRO_URL }}
          STATE_FILE: state.json
          OUTPUT_FILE: api/latest.json
          MAX_ITEMS: 100
        run: node index.js

      - name: Prepare Pages artifact
        working-directory: ${{ steps.locate.outputs.scraper_dir }}
        run: |
          mkdir -p dist
          cp api/latest.json dist/latest.json
          if [ -f state.json ]; then
            cp state.json dist/state.json
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate.outputs.scraper_dir }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
